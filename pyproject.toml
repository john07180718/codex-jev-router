[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-jev-router"
version = "0.1.0"
description = "Optional, advisory-only JEV workflow for Codex development assistance"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "john07180718 and contributors"}]
dependencies = []

[project.scripts]
jev-workflow = "jev_workflow.cli:main"

[tool.setuptools.packages.find]
include = ["jev_workflow*"]

[project.urls]
Homepage = "https://github.com/john07180718/codex-jev-router"
Repository = "https://github.com/john07180718/codex-jev-router"
Issues = "https://github.com/john07180718/codex-jev-router/issues"
