name: Offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline tests (no JEV or OpenAI keys)
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q jev_workflow tools tests
      - name: Run isolated mock demo
        run: python -m jev_workflow demo
      - name: Check unfilled benchmark template does not invent savings
        run: python tools/compare_usage.py examples/benchmark.template.json
