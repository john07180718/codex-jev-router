name: Offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline tests (no JEV or OpenAI keys)
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q jev_workflow tools tests
      - name: Run isolated mock demo
        run: python -m jev_workflow demo
      - name: Check unfilled benchmark template does not invent savings
        run: python tools/compare_usage.py examples/benchmark.template.json
